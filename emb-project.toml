project = "prj-tif2838"

[ci]
target = "//applications/tif2838/swe/app:app"
config = "c2000"
artifact-patterns = "app *.elfdmp *.map"
submodules = "recursive"

# Submodules this branch follows. Not listed = frozen.
# track: branch, or "tag:<glob>"; mode: auto (push after green CI), pr, off.
# Release branches must follow a maintained line (e.g. "release/1.x"), not main.
[follow."emb-toolchain"]
track = "main"
mode = "auto"

[follow."emb-platform"]
track = "main"
mode = "auto"

[follow."ci/emb-ci"]
track = "main"
mode = "auto"
